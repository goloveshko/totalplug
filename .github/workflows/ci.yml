# File: .github/workflows/ci.yml
name: TotalPlug CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          cache: true

      # The root main.go embeds all:frontend/dist, which is gitignored, so a
      # fresh checkout has no dist and `go vet ./...` / `go test ./...` fail to
      # load the root package. Build the frontend first to materialise it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Verify Go Modules
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race -cover ./...

      - name: Compile CLI Binary
        run: go build -v ./cmd/totalplug

  # The GUI binary is built by `wails build` locally only, so at least the
  # frontend contract (imports + production bundle) gets checked here.
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Check formatting
        run: npm run format:check
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
