# File: .github/workflows/ci.yml
name: TotalPlug CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          cache: true

      - name: Verify Go Modules
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race -cover ./...

      - name: Compile CLI Binary
        run: go build -v ./cmd/totalplug
