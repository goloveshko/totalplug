<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- Production-only (vite dev strips it — see vite.config.js). Wails prepends its
         own runtime scripts to <head> and delivers Go->JS callbacks through WebView2
         ExecuteScript; neither is affected by a page CSP meta tag. -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
        />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>TotalPlug</title>
        <link rel="stylesheet" href="/boot.css" />
        <script src="/boot.js"></script>
    </head>
    <body>
        <div id="app">
            <!-- Four roots, one column: each holds the islands that own it, and
                 none of them is ever rebuilt. -->
            <div id="chrome"></div>
            <div id="table"></div>
            <div id="overlays"></div>
            <div id="settings"></div>
        </div>
        <script src="./src/main.js" type="module"></script>
    </body>
</html>
